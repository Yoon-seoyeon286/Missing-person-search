<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>사진 관리</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f5f8fd 0%, #e8f0fb 100%);
            min-height: 100vh;
            color: #1a2d45;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 20px;
            border-bottom: 1px solid rgba(0,84,166,0.1);
            background: rgba(255,255,255,0.7);
        }
        .btn-back {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            border-radius: 8px;
            color: #1a2d45;
        }
        .btn-back svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; }
        .btn-back:hover { background: rgba(0,84,166,0.1); }
        h1 { font-size: 18px; font-weight: 700; }
        .count { font-size: 13px; color: rgba(26,45,69,0.5); margin-left: auto; }

        .container { padding: 20px; max-width: 480px; margin: 0 auto; }

        .empty {
            text-align: center;
            padding: 60px 20px;
            color: rgba(26,45,69,0.4);
            font-size: 15px;
        }

        .grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 2px 8px rgba(0,84,166,0.08);
        }
        .card img {
            width: 64px;
            height: 64px;
            object-fit: cover;
            border-radius: 10px;
            background: #e8f0fb;
            flex-shrink: 0;
        }
        .card-info { flex: 1; min-width: 0; }
        .card-id {
            font-size: 11px;
            color: rgba(26,45,69,0.4);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card-time {
            font-size: 13px;
            color: #1a4080;
            margin-top: 2px;
        }
        .card-actions { display: flex; gap: 8px; flex-shrink: 0; }
        .btn-ar {
            padding: 8px 12px;
            background: #0054a6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            white-space: nowrap;
        }
        .btn-delete {
            padding: 8px 12px;
            background: rgba(255,80,80,0.1);
            color: #e03;
            border: 1px solid rgba(255,80,80,0.3);
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }
        .btn-delete:hover { background: rgba(255,80,80,0.2); }

        .loading {
            text-align: center;
            padding: 40px;
            color: rgba(26,45,69,0.4);
        }
    </style>
</head>
<body>
    <div class="header">
        <button class="btn-back" onclick="location.href='index.html'">
            <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <h1>사진 관리</h1>
        <span class="count" id="count"></span>
    </div>
    <div class="container">
        <div class="loading" id="loading">불러오는 중...</div>
        <div class="grid" id="grid"></div>
        <div class="empty" id="empty" style="display:none">저장된 사진이 없습니다</div>
    </div>

    <script>
        function formatTime(ms) {
            const d = new Date(ms);
            return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
        }

        async function loadImages() {
            const res = await fetch('/api/images');
            const images = await res.json();
            document.getElementById('loading').style.display = 'none';

            if (images.length === 0) {
                document.getElementById('empty').style.display = 'block';
                return;
            }

            document.getElementById('count').textContent = `총 ${images.length}장`;
            const grid = document.getElementById('grid');
            images.forEach(({ id, createdAt }) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.id = `card-${id}`;
                card.innerHTML = `
                    <img src="/api/image/${id}" alt="">
                    <div class="card-info">
                        <div class="card-id">${id}</div>
                        <div class="card-time">${formatTime(createdAt)}</div>
                    </div>
                    <div class="card-actions">
                        <a class="btn-ar" href="/ar.html?id=${id}" target="_blank">AR 보기</a>
                        <button class="btn-delete" onclick="deleteImage('${id}')">삭제</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        async function deleteImage(id) {
            if (!confirm('이 사진을 삭제할까요?')) return;
            const res = await fetch(`/api/image/${id}`, { method: 'DELETE' });
            if (res.ok) {
                document.getElementById(`card-${id}`)?.remove();
                const remaining = document.querySelectorAll('.card').length;
                document.getElementById('count').textContent = remaining ? `총 ${remaining}장` : '';
                if (!remaining) document.getElementById('empty').style.display = 'block';
            } else {
                alert('삭제 실패');
            }
        }

        loadImages();
    </script>
</body>
</html>
