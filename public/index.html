<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Missing-Person-AR</title>
    <link rel="stylesheet" href="css/index.css">
</head>

<body>
    <div class="container">
        <header class="app-header">
            <img class="police-logo" src="/logo/police-logo.png" alt="경찰청">
            <div class="header-text">
                <h1 class="app-title">실종자 AR 시스템</h1>
                <p class="app-org">경찰청 과학수사대</p>
            </div>
        </header>
        <p class="subtitle">이미지에서 배경을 자동으로 제거하고<br>카메라에 표시합니다</p>

        <!-- 첫 화면 메인 버튼 -->
        <div class="main-actions">
            <button class="btn btn-primary" id="upload-full-btn">
                <svg viewBox="0 0 24 24">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="17 8 12 3 7 8"/>
                    <line x1="12" y1="3" x2="12" y2="15"/>
                </svg>
                전신 사진 올리기
            </button>
            <button class="btn btn-secondary" id="composite-btn">
                <svg viewBox="0 0 24 24">
                    <rect x="2" y="6" width="13" height="13" rx="2"/>
                    <rect x="9" y="5" width="13" height="13" rx="2"/>
                </svg>
                합성하기
            </button>
        </div>

        <input type="file" id="file-input" accept="image/*">

        <div class="preview-container" id="preview-container">
            <img class="preview-image" id="preview-image" alt="미리보기">
            <p class="preview-info" id="preview-info"></p>
        </div>

        <div class="progress-container" id="progress-container">
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <p class="progress-text" id="progress-text">배경 제거 중...</p>
        </div>

        <div class="result-container" id="result-container">
            <p class="result-label">✓ 배경 제거 완료</p>
            <img class="result-image" id="result-image" alt="결과">
        </div>

        <!-- 누끼 완료 후 링크 결과 -->
        <div class="result-links" id="result-links">
            <a class="btn btn-primary" id="btn-ar-link" href="#">
                <svg viewBox="0 0 24 24">
                    <path d="M23 7l-7 5 7 5V7z"/>
                    <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
                </svg>
                AR로 보기
            </a>
            <button class="btn btn-secondary" id="btn-copy-idx">
                <svg viewBox="0 0 24 24">
                    <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
                    <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
                </svg>
                링크 복사
            </button>
        </div>

        <div class="toast" id="toast">링크가 복사되었습니다</div>

        <div class="error-message" id="error-message"></div>
    </div>

    
    <script type="module" src="js/index.js"></script>
</body>

</html>
