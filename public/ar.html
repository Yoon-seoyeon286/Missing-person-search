<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Missing-Person-AR</title>
    <link rel="stylesheet" href="css/ar.css">
</head>

<body>
    <!-- iOS 등: 사용자 탭 후 AR 시작 (제스처 필요) -->
    <div id="tap-to-start" class="tap-to-start-overlay">
        <p class="tap-to-start-text">화면을 눌러 AR 시작</p>
    </div>

    <!-- 로딩 화면 -->
    <div id="loading-screen" class="hidden">
        <div class="loading-spinner"></div>
        <p class="loading-text" id="loading-text">카메라 연결 중...</p>
    </div>

    <!-- 에러 화면 -->
    <div class="error-screen" id="error-screen">
        <div class="error-icon">
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10" />
                <line x1="12" y1="8" x2="12" y2="12" />
                <line x1="12" y1="16" x2="12.01" y2="16" />
            </svg>
        </div>
        <p class="error-message" id="error-message">오류가 발생했습니다</p>
        <button class="btn-error" onclick="location.href='index.html'">
            <svg viewBox="0 0 24 24">
                <polyline points="15 18 9 12 15 6" />
            </svg>
            이미지 다시 선택
        </button>
    </div>

    <!-- 카메라 비디오 -->
    <video id="video-background" autoplay muted playsinline></video>

    <!-- Three.js 캔버스 -->
    <div id="canvas-container"></div>

    <!-- 터치 영역 -->
    <div id="touch-area"></div>

    <!-- 링크 복사 토스트 -->
    <div class="toast" id="toast">링크가 복사되었습니다</div>

    <!-- 상단 UI -->
    <div class="top-ui">
        <button class="btn-icon" id="btn-back" title="뒤로가기">
            <svg viewBox="0 0 24 24">
                <polyline points="15 18 9 12 15 6" />
            </svg>
        </button>
        <button class="btn-icon" id="btn-copy-link" title="링크 복사">
            <svg viewBox="0 0 24 24">
                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
            </svg>
        </button>
    </div>

    <!-- 안내 오버레이 -->
    <div class="hint-overlay" id="hint-overlay">
        <div class="hint-title">이동 및 확대 가능합니다</div>
        <div class="hint-text">
            드래그하여 위치 이동<br>
            핀치하여 크기 조절
        </div>
    </div>

    <!-- 하단 버튼 -->
    <div class="bottom-ui">
        <button class="btn-side" id="btn-new-image" title="새 이미지">
            <svg viewBox="0 0 24 24">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
                <circle cx="8.5" cy="8.5" r="1.5" />
                <polyline points="21 15 16 10 5 21" />
            </svg>
        </button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="js/ar.js"></script>
</body>

</html>
