<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>합성하기</title>
    <link rel="stylesheet" href="css/composite.css">
</head>

<body>
    <div class="container">

        <header class="page-header">
            <button class="btn-back" id="btn-back">
                <svg viewBox="0 0 24 24">
                    <polyline points="15 18 9 12 15 6"/>
                </svg>
            </button>
            <h1 class="page-title">합성하기</h1>
        </header>

        <!-- 1. 신체 정보 -->
        <section class="section">
            <h2 class="section-title">신체 정보</h2>
            <div class="field-row">
                <div class="field">
                    <label>키</label>
                    <div class="input-wrap">
                        <input type="number" id="height" placeholder="170" min="100" max="250">
                        <span class="unit">cm</span>
                    </div>
                </div>
                <div class="field">
                    <label>몸무게</label>
                    <div class="input-wrap">
                        <input type="number" id="weight" placeholder="60" min="20" max="200">
                        <span class="unit">kg</span>
                    </div>
                </div>
                <div class="field">
                    <label>나이</label>
                    <div class="input-wrap">
                        <input type="number" id="age" placeholder="30" min="1" max="100">
                        <span class="unit">세</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- 2. 얼굴 사진 -->
        <section class="section">
            <h2 class="section-title">얼굴 사진</h2>
            <p class="section-hint">정면 얼굴이 잘 보이는 사진을 올려주세요</p>
            <div class="upload-box" id="face-upload-box">
                <input type="file" id="face-input" accept="image/*">
                <div class="upload-placeholder" id="face-placeholder">
                    <svg viewBox="0 0 24 24">
                        <circle cx="12" cy="8" r="4"/>
                        <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
                    </svg>
                    <span>얼굴 사진 선택</span>
                </div>
                <img class="upload-preview" id="face-preview" alt="얼굴 미리보기">
            </div>
        </section>

        <!-- 3. 옷차림 -->
        <section class="section">
            <h2 class="section-title">옷차림</h2>
            <div class="toggle-group">
                <button class="toggle-btn active" id="outfit-text-btn">텍스트로 입력</button>
                <button class="toggle-btn" id="outfit-photo-btn">사진으로 선택</button>
            </div>

            <!-- 텍스트 입력 -->
            <div class="outfit-panel" id="outfit-text-panel">
                <textarea id="outfit-text" placeholder="예: 흰색 티셔츠, 청바지, 운동화" rows="3"></textarea>
            </div>

            <!-- 사진 업로드 -->
            <div class="outfit-panel hidden" id="outfit-photo-panel">
                <div class="upload-box" id="outfit-upload-box">
                    <input type="file" id="outfit-input" accept="image/*">
                    <div class="upload-placeholder" id="outfit-placeholder">
                        <svg viewBox="0 0 24 24">
                            <rect x="3" y="3" width="18" height="18" rx="2"/>
                            <circle cx="8.5" cy="8.5" r="1.5"/>
                            <polyline points="21 15 16 10 5 21"/>
                        </svg>
                        <span>옷차림 사진 선택</span>
                    </div>
                    <img class="upload-preview" id="outfit-preview" alt="옷차림 미리보기">
                </div>
            </div>
        </section>

        <!-- 합성 시작 버튼 (다음 단계에서 기능 연결) -->
        <button class="btn-composite" id="btn-composite" disabled>
            <svg viewBox="0 0 24 24">
                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
            </svg>
            합성 시작
        </button>
        <p class="coming-soon">이미지 생성 기능은 준비 중입니다</p>

        <div class="error-message" id="error-message"></div>

    </div>

    <script src="js/composite.js"></script>
</body>

</html>
